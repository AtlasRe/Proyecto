<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Feliz Cumpleaños Lizzy 💙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
  }

  body {
    background: linear-gradient(180deg, #d8ecff 0%, #e8f5ff 40%, #f4fbff 70%, #ffffff 100%);
    position: relative;
  }

  /* ---------- ESTRELLAS ---------- */
  .star {
    position: absolute;
    color: #a8d8ff;
    font-size: 18px;
    animation: twinkle 2.5s infinite ease-in-out;
    text-shadow: 0 0 10px rgba(160, 210, 255, 0.8);
    user-select: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.85) rotate(0deg); }
    50%      { opacity: 1;    transform: scale(1.15) rotate(20deg); }
  }

  /* ---------- GLOBOS ---------- */
  .balloon {
    position: absolute;
    width: 55px;
    height: 70px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    box-shadow: inset -8px -10px 18px rgba(255,255,255,0.9),
                inset 6px 8px 14px rgba(120, 170, 220, 0.3);
    animation: floatUp linear infinite;
    z-index: 1;
  }
  .balloon::before {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 10px solid rgba(140, 190, 235, 0.6);
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: 50%;
    width: 1.5px;
    height: 60px;
    background: rgba(150, 195, 235, 0.5);
    transform: translateX(-50%);
  }

  @keyframes floatUp {
    0%   { transform: translateY(110vh) translateX(0) rotate(-4deg); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translateY(45vh) translateX(25px) rotate(4deg); }
    92%  { opacity: 1; }
    100% { transform: translateY(-25vh) translateX(-15px) rotate(-3deg); opacity: 0; }
  }

  /* ---------- TÍTULO CENTRAL ---------- */
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    padding: 20px;
  }

  .title-wrap {
    position: relative;
    display: inline-block;
    padding: 40px 55px;
  }

  h1 {
    font-size: clamp(1.8rem, 5.5vw, 4rem);
    color: #5a9bd6;
    text-shadow: 3px 3px 0 #ffffff, 6px 6px 14px rgba(120, 170, 220, 0.45);
    line-height: 1.35;
    animation: bounceTitle 3s ease-in-out infinite;
  }
  h1 .hl {
    color: #7fb8e6;
    display: block;
    font-size: 0.85em;
    margin-top: 12px;
  }
  @keyframes bounceTitle {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* Globitos alrededor del título */
  .titled-balloon {
    position: absolute;
    width: 34px;
    height: 44px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    box-shadow: inset -5px -6px 12px rgba(255,255,255,0.9),
                inset 4px 5px 10px rgba(120, 170, 220, 0.3);
    animation: bob 2.8s ease-in-out infinite;
  }
  .titled-balloon::before {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 7px solid rgba(140, 190, 235, 0.6);
  }
  .titled-balloon::after {
    content: '';
    position: absolute;
    bottom: -34px; left: 50%;
    width: 1.2px; height: 34px;
    background: rgba(150, 195, 235, 0.55);
    transform: translateX(-50%);
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-12px) rotate(4deg); }
  }
  .tb1 { top: -18px;  left: -14px;  animation-delay: 0s; }
  .tb2 { top: 10px;   right: -30px; animation-delay: .4s; }
  .tb3 { bottom: -6px;left: -28px;  animation-delay: .8s; }
  .tb4 { bottom: -22px;right: 6px;  animation-delay: 1.2s; }
  .tb5 { top: -22px;  right: 22px;  animation-delay: .6s; }
  .tb6 { bottom: 20px;left: 24px;   animation-delay: 1.4s; }

  /* Mensaje secundario */
  .sub-msg {
    margin-top: 18px;
    font-size: clamp(0.95rem, 2.2vw, 1.25rem);
    color: #86b4dc;
    letter-spacing: 1px;
    animation: fadeIn 2s ease-in;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- CINNAMOROLL (SVG) ---------- */
  .cinnamo-wrap {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    width: clamp(180px, 30vw, 260px);
    animation: cinnamoFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(140, 180, 220, 0.35));
  }
  @keyframes cinnamoFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-12px); }
  }

  /* Globitos que Cinnamoroll sostiene */
  .cinnamo-balloon {
    position: absolute;
    width: 26px;
    height: 34px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    box-shadow: inset -4px -5px 10px rgba(255,255,255,0.9),
                inset 3px 4px 8px rgba(120, 170, 220, 0.3);
    animation: bob 3s ease-in-out infinite;
    z-index: 9;
  }
  .cinnamo-balloon::before {
    content: '';
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 6px solid rgba(140, 190, 235, 0.6);
  }
  .cinnamo-balloon::after {
    content: '';
    position: absolute;
    bottom: -50px; left: 50%;
    width: 1.2px; height: 50px;
    background: rgba(150, 195, 235, 0.55);
    transform: translateX(-50%);
  }
  .cb1 { top: 22%;  left: 6%;  animation-delay: 0s; }
  .cb2 { top: 12%;  right: 4%; animation-delay: .5s; }
  .cb3 { top: 40%;  left: -2%; animation-delay: 1s; }

  @media (max-width: 500px) {
    .title-wrap { padding: 26px 30px; }
    .cinnamo-wrap { width: 150px; }
  }
</style>
</head>
<body>

  <!-- GLOBOS DE FONDO (se generan con JS) -->
  <div id="balloons"></div>

  <!-- ESTRELLAS -->
  <div id="stars"></div>

  <!-- TÍTULO CENTRAL -->
  <div class="center">
    <div class="title-wrap">
      <div class="titled-balloon tb1" style="background:radial-gradient(circle at 30% 25%, #cfe8ff, #a3d1f7)"></div>
      <div class="titled-balloon tb2" style="background:radial-gradient(circle at 30% 25%, #dcefff, #b0d9f9)"></div>
      <div class="titled-balloon tb3" style="background:radial-gradient(circle at 30% 25%, #c2e2ff, #97cbf3)"></div>
      <div class="titled-balloon tb4" style="background:radial-gradient(circle at 30% 25%, #e0f1ff, #b8ddf9)"></div>
      <div class="titled-balloon tb5" style="background:radial-gradient(circle at 30% 25%, #cbe7ff, #9fd0f6)"></div>
      <div class="titled-balloon tb6" style="background:radial-gradient(circle at 30% 25%, #d5ebff, #aad6f8)"></div>

      <h1>
        Feliz cumpleaños Lizzy
        <span class="hl">te quiero un montón</span>
      </h1>
    </div>
    <p class="sub-msg">✨ Que este día sea tan especial como tú ✨</p>
  </div>

  <!-- CINNAMOROLL + sus globitos -->
  <div class="cinnamo-wrap">
    <div class="cinnamo-balloon cb1" style="background:radial-gradient(circle at 30% 25%, #cfe8ff, #a3d1f7)"></div>
    <div class="cinnamo-balloon cb2" style="background:radial-gradient(circle at 30% 25%, #dcefff, #b0d9f9)"></div>
    <div class="cinnamo-balloon cb3" style="background:radial-gradient(circle at 30% 25%, #c2e2ff, #97cbf3)"></div>

    <!-- Cinnamoroll en SVG -->
    <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
      <!-- Cuerpo -->
      <ellipse cx="150" cy="255" rx="72" ry="58" fill="#ffffff" stroke="#b8d8f0" stroke-width="3"/>
      <!-- Patitas -->
      <ellipse cx="115" cy="300" rx="22" ry="14" fill="#ffffff" stroke="#b8d8f0" stroke-width="3"/>
      <ellipse cx="185" cy="300" rx="22" ry="14" fill="#ffffff" stroke="#b8d8f0" stroke-width="3"/>
      <!-- Cola rizada -->
      <path d="M218 240 q28 -8 22 -32 q-4 -18 -22 -14" fill="none" stroke="#b8d8f0" stroke-width="10" stroke-linecap="round"/>
      <!-- Brazos -->
      <ellipse cx="92" cy="245" rx="18" ry="26" fill="#ffffff" stroke="#b8d8f0" stroke-width="3" transform="rotate(-20 92 245)"/>
      <ellipse cx="208" cy="245" rx="18" ry="26" fill="#ffffff" stroke="#b8d8f0" stroke-width="3" transform="rotate(20 208 245)"/>
      <!-- Orejas largas -->
      <ellipse cx="88" cy="118" rx="24" ry="58" fill="#ffffff" stroke="#b8d8f0" stroke-width="3" transform="rotate(-18 88 118)"/>
      <ellipse cx="212" cy="118" rx="24" ry="58" fill="#ffffff" stroke="#b8d8f0" stroke-width="3" transform="rotate(18 212 118)"/>
      <!-- Cabeza -->
      <ellipse cx="150" cy="165" rx="82" ry="70" fill="#ffffff" stroke="#b8d8f0" stroke-width="3"/>
      <!-- Mejillas rosadas -->
      <ellipse cx="105" cy="185" rx="13" ry="9" fill="#ffd6e5" opacity="0.85"/>
      <ellipse cx="195" cy="185" rx="13" ry="9" fill="#ffd6e5" opacity="0.85"/>
      <!-- Ojos -->
      <ellipse cx="122" cy="160" rx="7" ry="9" fill="#3a3a3a"/>
      <ellipse cx="178" cy="160" rx="7" ry="9" fill="#3a3a3a"/>
      <circle cx="124" cy="157" r="2.5" fill="#ffffff"/>
      <circle cx="180" cy="157" r="2.5" fill="#ffffff"/>
      <!-- Naricita -->
      <ellipse cx="150" cy="178" rx="5" ry="3.5" fill="#ffb3c8"/>
      <!-- Boquita -->
      <path d="M143 186 q7 6 14 0" fill="none" stroke="#ffb3c8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Estrellitas decorativas -->
      <text x="45" y="60" font-size="20" fill="#a8d8ff">✦</text>
      <text x="240" y="80" font-size="16" fill="#a8d8ff">✦</text>
      <text x="70" y="290" font-size="14" fill="#a8d8ff">✦</text>
    </svg>
  </div>

<script>
  // ---------- Generar globos de fondo ----------
  const balloonBox = document.getElementById('balloons');
  const pastelBlues = [
    'radial-gradient(circle at 30% 25%, #e3f2ff, #b8dcf9)',
    'radial-gradient(circle at 30% 25%, #d0e9ff, #9fcff4)',
    'radial-gradient(circle at 30% 25%, #c7e5ff, #8fc4ef)',
    'radial-gradient(circle at 30% 25%, #dff0ff, #b0d8f7)',
    'radial-gradient(circle at 30% 25%, #eaf6ff, #c2e0f9)',
    'radial-gradient(circle at 30% 25%, #bfe0ff, #95c8f0)'
  ];

  const totalBalloons = 22;
  for (let i = 0; i < totalBalloons; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    const size = 40 + Math.random() * 45;
    b.style.width = size + 'px';
    b.style.height = (size * 1.25) + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.background = pastelBlues[Math.floor(Math.random() * pastelBlues.length)];
    b.style.animationDuration = (10 + Math.random() * 10) + 's';
    b.style.animationDelay = (Math.random() * 12) + 's';
    b.style.opacity = 0.75 + Math.random() * 0.25;
    balloonBox.appendChild(b);
  }

  // ---------- Generar estrellas ----------
  const starBox = document.getElementById('stars');
  const stars = ['✦', '✧', '★', '✩', '⋆'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = stars[Math.floor(Math.random() * stars.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.fontSize = (10 + Math.random() * 20) + 'px';
    s.style.animationDelay = (Math.random() * 2.5) + 's';
    starBox.appendChild(s);
  }
</script>
</body>
</html>
